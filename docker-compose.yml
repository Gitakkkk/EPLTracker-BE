services:
  db:
    image: postgres:16-alpine
    container_name: epltracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: epltracker
      POSTGRES_PASSWORD: epltracker
      POSTGRES_DB: epltracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: epltracker-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
